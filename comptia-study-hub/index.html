<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub di studio CompTIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Patrick+Hand&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one column study desk; exam colour on headers, five domain hues shared by bars, rings and map branches */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#e9edf1; --ink:#15202b; --muted:#566575; --line:#d5dde4;
  --net:#0b6e7f; --sec:#3a4cc0; --pen:#a8242f;
  --d1:#0b7285; --d2:#2b64c8; --d3:#7447c2; --d4:#b25a06; --d5:#b82c66;
  --ok:#1b7f47; --bad:#b93232; --okbg:#e3f4ea; --badbg:#fbe6e6; --tipbg:#fff6dc; --tipink:#6b4e00;
  --display:"Sora","Segoe UI",system-ui,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --accent:var(--net);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0e141a; --surface:#172029; --sunk:#111920; --ink:#e6edf3; --muted:#9aa9b7; --line:#2a3845;
  --net:#3fb6c9; --sec:#8794f2; --pen:#ee7480;
  --d1:#35aec2; --d2:#6c9cf0; --d3:#a685ea; --d4:#e0953f; --d5:#ea6c9d;
  --ok:#52c285; --bad:#f07a7a; --okbg:#143524; --badbg:#3a1a1c; --tipbg:#33290c; --tipink:#f1d68a;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0e141a; --surface:#172029; --sunk:#111920; --ink:#e6edf3; --muted:#9aa9b7; --line:#2a3845;
  --net:#3fb6c9; --sec:#8794f2; --pen:#ee7480;
  --d1:#35aec2; --d2:#6c9cf0; --d3:#a685ea; --d4:#e0953f; --d5:#ea6c9d;
  --ok:#52c285; --bad:#f07a7a; --okbg:#143524; --badbg:#3a1a1c; --tipbg:#33290c; --tipink:#f1d68a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.7rem} h2{font-size:1.15rem} h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--body);font-weight:600;margin:14px 0 8px}
p{margin:0 0 10px} a{color:var(--accent)}
.num,.code,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sm{font-size:.875rem} .vh{position:absolute;left:-9999px}
.ex-n{--accent:var(--net)} .ex-s{--accent:var(--sec)} .ex-p{--accent:var(--pen)}
.d1{--dc:var(--d1)} .d2{--dc:var(--d2)} .d3{--dc:var(--d3)} .d4{--dc:var(--d4)} .d5{--dc:var(--d5)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 12px}
.top nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.top nav::-webkit-scrollbar{display:none}
.top button{font:500 .9rem var(--body);color:var(--muted);background:none;border:0;border-radius:8px;padding:8px 11px;white-space:nowrap;cursor:pointer}
.top button[aria-current="page"]{background:var(--ink);color:var(--surface)}
#lang{border:1.5px solid var(--line);color:var(--ink);font-family:var(--mono);font-weight:600;flex:none}
main{max-width:860px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:18px}

.hero h1{font-size:2rem;margin:4px 0 8px} .hero.slim h1{font-size:1.6rem}
.lead{color:var(--muted);max-width:62ch}
.eyebrow{font:600 .75rem var(--mono);letter-spacing:.04em;color:var(--accent);margin:0 0 4px;text-transform:uppercase}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card,.panel,.exhead,.qcard,.mapwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card,.exhead,.qcard,.mapwrap{border-top:5px solid var(--accent)}
.card{display:flex;flex-direction:column;gap:12px}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2{font-size:1.35rem;color:var(--accent)}
.code{font-size:.8rem;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;margin:0}
.exhead .facts{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin:12px 0}
.facts dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.facts dd{margin:0;font:600 1.25rem var(--mono)} .facts dd.sm{font-size:.9rem;font-family:var(--body);font-weight:500}
.facts small{display:block;font:400 .7rem var(--body);color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);margin:0}
.tag,.pill{display:inline-block;align-self:flex-start;font:600 .75rem var(--mono);border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:3px 10px;margin:0}
.wbar{display:flex;gap:2px;height:26px;border-radius:7px;overflow:hidden}
.wbar span{background:var(--dc);color:#fff;font:600 .72rem var(--mono);display:flex;align-items:center;justify-content:center;min-width:0}
.wlegend{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;font-size:.82rem}
.wlegend li{display:flex;gap:8px;align-items:baseline} .wlegend .num{margin-left:auto;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;background:var(--dc);flex:none;align-self:center}
.prog-h{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;margin-bottom:5px}
.meter{height:9px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--dc,var(--accent));border-radius:99px;transition:width .3s}
.meter.thin{height:5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .row.between{justify-content:space-between} .row.col{flex-direction:column;align-items:stretch}
.btn{font:600 .9rem var(--body);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.sm{font-size:.8rem;padding:6px 10px} .btn.big{padding:12px 20px;font-size:1rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:.85rem;cursor:pointer}
.steps{list-style:none;display:flex;gap:8px;flex-wrap:wrap;padding:0;margin:12px 0 0}
.steps li{border:1.5px solid var(--accent);color:var(--accent);border-radius:9px;padding:8px 12px;font-weight:600}
.steps b{font-family:var(--mono);margin-right:6px}
.fine{font-size:.8rem;color:var(--muted)}

.searchbox input{width:100%;font:1rem var(--body);padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.dom{display:flex;flex-direction:column;gap:8px}
.dom>h2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.dbadge{background:var(--dc);color:#fff;font:600 .8rem var(--mono);border-radius:6px;padding:3px 7px}
.obj{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;scroll-margin-top:64px}
.obj[open]{border-left-color:var(--accent)}
.obj.flash{box-shadow:0 0 0 3px var(--accent)}
.obj summary{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;cursor:pointer;list-style:none}
.obj summary::-webkit-details-marker{display:none}
.onum{font:600 .8rem var(--mono);color:var(--dc);border:1.5px solid var(--dc);border-radius:6px;padding:1px 6px;flex:none}
.otitle{font-weight:500;flex:1;min-width:0}
.check{color:var(--ok);font-weight:700;flex:none}
.obody{padding:0 14px 14px}
.obody ul,.mdetail ul{margin:0 0 12px;padding-left:20px;display:grid;gap:7px}
.tip{background:var(--tipbg);color:var(--tipink);border-radius:8px;padding:10px 12px;font-size:.9rem}
.tip b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.chk{display:flex;gap:6px;align-items:center;font-weight:600;font-size:.85rem;margin-right:auto}
.chk input{width:18px;height:18px;accent-color:var(--ok)}
.sheet{border-top:1px solid var(--line);padding:10px 0} .sheet summary{font-weight:600;cursor:pointer}
.tw{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap} td:last-child{white-space:normal;min-width:160px}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.empty{color:var(--muted);padding:20px 0}
.litecard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.plan{margin:10px 0 0;padding-left:22px;display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:400 .8rem var(--body);text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--accent);border-radius:8px;padding:6px 9px;cursor:pointer}
.chip b{color:var(--accent);font-family:var(--mono);font-size:.75rem;margin-right:4px}

.tabs{display:flex;gap:6px}
.tab{flex:1;font:600 .9rem var(--body);padding:10px 6px;border-radius:9px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--surface)}
.maptop{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.donut{max-width:100%;height:auto}
.seg{cursor:pointer} .seg path{fill:var(--dc);opacity:.85;transition:opacity .15s} .seg:hover path,.seg.on path{opacity:1}
.seg.on path{stroke:var(--ink);stroke-width:3}
.seg text{fill:#fff;font:600 14px var(--mono);pointer-events:none}
.dc1{fill:var(--ink);font:700 15px var(--display)} .dc2{fill:var(--muted);font:400 11px var(--mono)}
.tree .root{display:inline-block;background:var(--accent);color:var(--surface);font:700 1rem var(--display);border-radius:10px;padding:8px 14px}
.tree .root .code{color:inherit;opacity:.85;margin-left:6px}
.tree ul{list-style:none;margin:0;padding:0}
.l1{margin-left:16px!important;border-left:2px solid var(--line);padding-top:10px!important;display:grid;gap:10px}
.l1>li{position:relative;padding-left:18px}
.l1>li::before,.l2>li::before{content:"";position:absolute;left:0;top:20px;width:16px;border-top:2px solid var(--line)}
.l2{margin:8px 0 0 14px!important;border-left:2px solid var(--line);display:grid;gap:6px}
.l2>li{position:relative;padding-left:18px} .l2>li::before{top:17px}
.node{width:100%;text-align:left;font:inherit;cursor:pointer;border-radius:9px;display:flex;gap:8px;align-items:center}
.node.dn{background:var(--dc);color:#fff;border:0;padding:10px 12px;font-weight:600;justify-content:space-between}
.node.dn b{font-family:var(--mono);font-size:.85rem}
.node.dn::after{content:"+";font:700 1.1rem var(--mono);margin-left:4px} .node.dn[aria-expanded="true"]::after{content:"−"}
.node.dn span{flex:1}
.node.on{background:var(--surface);color:var(--ink);border:1.5px solid var(--dc);padding:7px 10px;font-size:.88rem}
.node.on i{font:600 .78rem var(--mono);color:var(--dc);font-style:normal;flex:none}
.node.on[aria-expanded="true"]{background:var(--sunk)}
.node.on.done::after{content:"✓";color:var(--ok);font-weight:700;margin-left:auto}
.mdetail{border-left:4px solid var(--dc);background:var(--sunk);border-radius:0 9px 9px 0;padding:12px;margin-top:6px;font-size:.88rem}
.themes{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:12px}
.theme h3{margin-top:0;color:var(--ink)}

.setup{display:grid;gap:14px}
.field{display:grid;gap:5px;border:0;padding:0;margin:0} .field label,.field legend{font-weight:600;font-size:.85rem;padding:0}
select{font:1rem var(--body);padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);width:100%}
.radio{display:flex;gap:8px;align-items:flex-start;font-weight:400!important;font-size:.95rem!important;padding:6px 0}
.radio input{margin-top:4px;accent-color:var(--accent)}
.qbar{display:flex;gap:12px;align-items:center;font-size:.85rem;color:var(--muted)} .qbar .link{margin-left:auto}
.timer{font:600 1rem var(--mono);color:var(--ink)}
.qcard h2{font:500 1.1rem/1.45 var(--body);margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer}
.opt b{font-family:var(--mono);color:var(--muted);flex:none}
.opt.sel{border-color:var(--accent);background:var(--sunk)} .opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:14px;border-radius:10px;padding:12px;display:grid;gap:8px;justify-items:start} .fb.ok{background:var(--okbg)} .fb.bad{background:var(--badbg)} .fb p{margin:0}
.score{text-align:center;display:grid;gap:4px;justify-items:center}
.big-num{font:700 3.2rem var(--display);margin:0;line-height:1}
.score.ready{--accent:var(--ok)} .score.more{--accent:var(--bad)} .score.almost{--accent:var(--d4)} .score .big-num{color:var(--accent)}
.brow{margin-top:12px}
.rev{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:4px;justify-items:start} .rev p{margin:0}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad)}

/* --- v2: maps, cards, polish --- */
main>*{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.78rem;color:var(--muted);line-height:1.3}
.stats b{display:block;font:700 1.6rem var(--display);color:var(--ink)}
.tools .btn{flex:1;white-space:nowrap}
.chip.soft{border-color:var(--line);background:var(--sunk);font-family:var(--mono);font-size:.75rem}
.chip.soft:hover{border-color:var(--accent)}
.seg2{display:flex;background:var(--sunk);border-radius:11px;padding:4px;gap:4px}
.seg2 button{flex:1;border:0;background:none;color:var(--muted);font:600 .9rem var(--body);padding:9px;border-radius:8px;cursor:pointer}
.seg2 button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.tab:not([class*="ex-"]){--accent:var(--ink)}
.mapbox{position:relative;height:min(68vh,620px);min-height:420px;background:var(--mapbg);border:1px solid var(--line);border-radius:16px;overflow:hidden;--accent:var(--ink)}
:root{--mapbg:#fbfcfd;--dotc:#cfd8e0;--glow:rgba(11,110,127,.35)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--mapbg:#0b1117;--dotc:#22303c;--glow:rgba(63,182,201,.45)}}
:root[data-theme="dark"]{--mapbg:#0b1117;--dotc:#22303c;--glow:rgba(63,182,201,.45)}
.mapsvg{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mapsvg:active{cursor:grabbing}
.dot0{fill:var(--dotc)}
.mapsvg text{font-family:var(--body);text-anchor:middle;pointer-events:none;fill:var(--ink)}
.nd{cursor:pointer;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .25s}
.nd .in{transform-box:fill-box;transform-origin:center}
.nd .in.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
.fresh .links{animation:fadein .6s .5s both} .fresh .wedge{animation:fadein .7s both}
@keyframes fadein{from{opacity:0}}
.n-ex circle{fill:var(--accent)} .n-ex .halo{fill:var(--accent);opacity:.14;animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.18);opacity:.05}}
.n-ex text{fill:var(--surface)} .t-name{font:700 15px var(--display)!important} .t-sub{font:400 10px var(--mono)!important;opacity:.85}
.n-dom circle{fill:var(--dc);stroke:var(--mapbg);stroke-width:4}
.n-dom .t-num{fill:#fff;font:700 22px var(--display)} .n-dom .t-w{fill:#fff;font:600 9px var(--mono);opacity:.9}
.n-dom .lab{font-weight:600;font-size:13px}
.n-obj circle{fill:var(--surface);stroke:var(--dc);stroke-width:3}
.n-obj .t-on{font:600 12px var(--mono);fill:var(--dc)}
.n-con circle{fill:var(--dc)} .n-con .ring{fill:none;stroke:var(--dc);stroke-width:1.5;stroke-dasharray:3 3}
.lab{font-size:11.5px;paint-order:stroke;stroke:var(--mapbg);stroke-width:4px;stroke-linejoin:round}
.ttl{display:none} .z-near .ttl,.nd.cur .ttl{display:block}
.z-far .n-con .lab{display:none} .z-far .nd.hi .lab{display:block}
.lk{fill:none;stroke:var(--dc);stroke-width:1.6;opacity:.38}
.l-t1{stroke-width:3;opacity:.55} .l-t2{stroke-width:2.2;opacity:.5}
.l-rel,.l-cross,.l-pre{stroke:var(--muted);stroke-dasharray:5 6;stroke-width:1.3;opacity:.3}
.sel .nd{opacity:.14} .sel .nd.hi{opacity:1} .sel .lk{opacity:.05}
.sel .lk.hi{opacity:.9;stroke-width:2;stroke-linecap:round;stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
.nd .in{transition:transform .3s}
.z-far .n-ex .in,.z-far .n-dom .in{transform:scale(2.1)} .z-far .n-obj .in{transform:scale(1.6)} .z-far .n-con .in{transform:scale(1.7)}
.z-far .n-dom .lab{display:none}
@keyframes flow{to{stroke-dashoffset:-28}}
.nd.cur circle:not(.halo):not(.ring){filter:drop-shadow(0 0 8px var(--glow));stroke:var(--ink);stroke-width:3}
.wedge{fill:var(--dc)} .w1{opacity:.16} .w2{opacity:.08}
.mctl{position:absolute;top:10px;right:10px;display:grid;gap:6px}
.mctl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 1.15rem var(--mono);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.mstat{position:absolute;top:12px;left:12px;margin:0;font:400 .7rem var(--mono);color:var(--muted)}
.mpanel{position:absolute;left:8px;right:8px;bottom:8px;max-height:48%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;box-shadow:0 8px 28px rgba(0,0,0,.22);animation:rise .25s ease both;font-size:.88rem}
.mpanel h2{font-size:1.05rem;margin:0 30px 8px 0} .mpanel ul{margin:0 0 8px;padding-left:18px;display:grid;gap:5px} .mpanel .row{margin-top:12px}
.pclose{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:var(--sunk);color:var(--ink);font-size:1.1rem;cursor:pointer}
.mlegend{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lg{display:flex;gap:6px;align-items:center;font:500 .78rem var(--body);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:5px 10px;cursor:pointer}
.lg i{width:10px;height:10px;border-radius:50%;background:var(--dc)}
.flash{display:block;width:100%;height:230px;perspective:1200px;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:var(--ink);position:relative}
.face{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:18px;border:1px solid var(--line);background:var(--surface);backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .55s cubic-bezier(.3,.7,.2,1);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.face.front{border-top:6px solid var(--net)} .face.back{transform:rotateY(180deg);border-top:6px solid var(--sec);background:var(--sunk)}
.flash.flipped .front{transform:rotateY(180deg)} .flash.flipped .back{transform:rotateY(360deg)}
